name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    env:
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SERVICE_NAME: ${{ secrets.SERVICE_NAME }}
      RELEASE_ID: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate deployment secrets
        run: |
          test -n "$NEXT_PUBLIC_API_URL"
          test -n "$BACKEND_URL"
          test -n "$DEPLOY_PATH"
          test -n "$SERVICE_NAME"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Prepare standalone package
        run: |
          set -euo pipefail

          rm -rf deploy-package frontend-release.tar.gz
          mkdir -p deploy-package

          cp -R .next/standalone/. deploy-package/

          mkdir -p deploy-package/.next
          cp -R .next/static deploy-package/.next/static

          if [ -d public ]; then
            cp -R public deploy-package/public
          fi

          test -f deploy-package/server.js
          test -d deploy-package/.next/static
          test -d deploy-package/node_modules

          tar -czf frontend-release.tar.gz -C deploy-package .

      - name: Upload release archive
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: frontend-release.tar.gz
          target: /tmp
          overwrite: true

      - name: Activate release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_PATH,SERVICE_NAME,RELEASE_ID,NEXT_PUBLIC_API_URL,BACKEND_URL
          script: |
            set -euo pipefail

            RELEASE_DIR="$DEPLOY_PATH/releases/$RELEASE_ID"
            ARCHIVE_PATH="/tmp/frontend-release.tar.gz"

            test -n "$DEPLOY_PATH"
            test -n "$SERVICE_NAME"
            test -n "$RELEASE_ID"
            test -n "$NEXT_PUBLIC_API_URL"
            test -n "$BACKEND_URL"
            test -f "$ARCHIVE_PATH"

            mkdir -p "$DEPLOY_PATH/releases" "$DEPLOY_PATH/shared"

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"

            tar -xzf "$ARCHIVE_PATH" -C "$RELEASE_DIR"

            cat > "$RELEASE_DIR/.env.production" <<EOF
            NODE_ENV=production
            PORT=3000
            HOSTNAME=127.0.0.1
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            BACKEND_URL=$BACKEND_URL
            EOF

            test -f "$RELEASE_DIR/.env.production"
            test -f "$RELEASE_DIR/server.js"
            test -d "$RELEASE_DIR/.next"
            test -d "$RELEASE_DIR/.next/static"
            test -d "$RELEASE_DIR/node_modules"

            if id deploy >/dev/null 2>&1; then
              chown -R deploy:deploy "$RELEASE_DIR"
            fi

            ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current"

            if id deploy >/dev/null 2>&1; then
              chown -h deploy:deploy "$DEPLOY_PATH/current"
            fi

            sudo -n /usr/bin/systemctl daemon-reload
            sudo -n /usr/bin/systemctl restart "$SERVICE_NAME"
            /usr/bin/systemctl is-active --quiet "$SERVICE_NAME"

            sleep 2
            curl -fsSI http://127.0.0.1:3000 >/dev/null

            CURRENT_REALPATH="$(readlink -f "$DEPLOY_PATH/current" || true)"

            find "$DEPLOY_PATH/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -n \
              | head -n -5 \
              | cut -d' ' -f2- \
              | while read -r old_release; do
                  if [ "$old_release" != "$CURRENT_REALPATH" ]; then
                    rm -rf "$old_release"
                  fi
                done
